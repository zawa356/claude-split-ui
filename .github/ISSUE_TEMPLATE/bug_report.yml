name: Bug report
description: Report a reproducible behavior without sharing personal data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** Do not upload HAR archives, raw bootstrap responses, cookies, tokens, account identifiers or private conversations.
        **Status:** WXT builds are experimental; only the original Firefox PoC has been manually validated.
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Firefox original PoC
        - Firefox WXT (unverified)
        - Chrome WXT (unverified)
        - Desktop (not implemented)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Browser version
      placeholder: "e.g. Firefox 157"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps (no personal data)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials, account identifiers, authenticated captures and conversation content.
          required: true
