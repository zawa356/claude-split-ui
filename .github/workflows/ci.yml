name: CI - Firefox baseline and WXT builds (experimental)

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-poc:
    name: Test and package proven Firefox PoC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build:poc
      - run: unzip -t dist/claude-split-ui-firefox-poc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-verified-poc
          path: dist/claude-split-ui-firefox-poc.zip
          if-no-files-found: error

  wxt-build:
    name: Build WXT (${{ matrix.browser }} MV3) - runtime unverified
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @claude-split-ui/browser-extension typecheck
      - name: Bundle WXT
        run: pnpm run build:${{ matrix.browser }}
      - name: Inspect generated manifest
        run: node scripts/verify-wxt-build.mjs ${{ matrix.browser }}
      - name: ZIP build
        run: pnpm run zip:${{ matrix.browser }}
      - name: Upload WXT build ZIP (NOT browser-tested)
        uses: actions/upload-artifact@v4
        with:
          name: wxt-${{ matrix.browser }}-mv3-unverified
          path: apps/browser-extension/.output/*-${{ matrix.browser }}.zip
          if-no-files-found: error
