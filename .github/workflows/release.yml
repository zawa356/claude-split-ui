name: Prerelease (tested Firefox PoC only)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prerelease:
    name: Validate and publish experimental prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checks and tests
        run: |
          npm run check
          npm test
      - name: Build verified Firefox PoC
        run: |
          npm run build:poc
          unzip -t dist/claude-split-ui-firefox-poc.zip
          cd dist && sha256sum claude-split-ui-firefox-poc.zip > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/claude-split-ui-firefox-poc.zip
            dist/SHA256SUMS.txt
