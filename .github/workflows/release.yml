name: Publish browser extension prerelease

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    name: Validate, bundle and publish browser ZIPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Validate project and manifests
        run: |
          npm run check
          npm test
          node scripts/check-docs.mjs
          pnpm --filter @claude-split-ui/browser-extension typecheck
      - name: Package browser builds
        run: |
          pnpm run zip:firefox
          pnpm run zip:chrome
          node scripts/verify-wxt-build.mjs firefox
          node scripts/verify-wxt-build.mjs chrome
      - name: Verify and stage distributable archives
        run: node scripts/stage-release.mjs
      - name: Upload temporary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-packages
          path: dist/release/
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Claude Split UI ${{ github.ref_name }} (Experimental)
          body_path: docs/releases/v0.1.0.md
          files: |
            dist/release/claude-split-ui-0.1.0-firefox.zip
            dist/release/claude-split-ui-0.1.0-chrome.zip
            dist/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
