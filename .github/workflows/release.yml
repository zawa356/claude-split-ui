name: Publish browser extension prerelease

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  prerelease:
    name: Validate, bundle and publish browser ZIPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Read and validate release version
        id: version
        run: |
          VERSION="$(node -p "require('./apps/browser-extension/package.json').version")"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          test -f "docs/releases/v$VERSION.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate project and manifests
        run: |
          npm run check
          npm test
          node scripts/check-docs.mjs
          pnpm --filter @claude-split-ui/browser-extension typecheck
      - name: Package browser builds
        run: |
          pnpm run zip:firefox
          pnpm run zip:chrome
          node scripts/verify-wxt-build.mjs firefox
          node scripts/verify-wxt-build.mjs chrome
      - name: Package Claude Desktop (claude-desktop-webext + Chrome build)
        run: |
          V="${{ steps.version.outputs.version }}"
          node vendor/claude-desktop-webext/tools/package.mjs --config apps/desktop/desktop-webext.json --extension apps/browser-extension/.output/chrome-mv3 --out "dist/desktop/claude-split-ui-$V-desktop"
          (cd dist/desktop && zip -qr "claude-split-ui-$V-desktop.zip" "claude-split-ui-$V-desktop")
      - name: Verify and stage distributable archives
        run: |
          node scripts/stage-release.mjs
          cd dist/release
          unzip -t "claude-split-ui-${{ steps.version.outputs.version }}-firefox.zip"
          unzip -t "claude-split-ui-${{ steps.version.outputs.version }}-chrome.zip"
          unzip -t "claude-split-ui-${{ steps.version.outputs.version }}-desktop.zip"
          sha256sum -c SHA256SUMS.txt
      - name: Upload temporary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-packages
          path: dist/release/
          if-no-files-found: error
      - name: Check whether version prerelease exists
        id: existing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub prerelease
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Split UI v${{ steps.version.outputs.version }} (Experimental)
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: |
            dist/release/claude-split-ui-${{ steps.version.outputs.version }}-firefox.zip
            dist/release/claude-split-ui-${{ steps.version.outputs.version }}-chrome.zip
            dist/release/claude-split-ui-${{ steps.version.outputs.version }}-desktop.zip
            dist/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
